name: Release

# On a version tag (vX.Y.Z): build, pack the one-click MCPB bundle, and attach
# it to a GitHub Release. Optionally publishes to npm if an NPM_TOKEN secret is
# set. Manual dispatch runs a dry pack (no release/publish) and uploads the
# .mcpb as a workflow artifact so you can test the bundle before tagging.
#
# The official MCP registry publish is a SEPARATE job on purpose. It runs after
# npm publish has succeeded, and keeping it out of the release job means a
# transient registry failure can be re-run on its own — re-running the release
# job would fail on `npm publish` because the version already exists.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create releases + upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    outputs:
      npm_published: ${{ steps.npm_publish.outputs.published }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Build (tsc)
        run: npm run build

      - name: Smoke — all 23 tools register
        run: node scripts/ci-smoke.mjs
        env:
          DIAGRAMS_API_KEY: dgz_test_ci_dummy_no_calls

      - name: Version is consistent across package/manifest/server.json and src
        run: node scripts/check-version-sync.mjs

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi
          echo "tag matches package.json ($PKG)"

      # Publish BEFORE pruning dev deps: npm runs the `prepare` script (tsc) on
      # publish even under --ignore-scripts, so typescript/@types/node must
      # still be installed here. The rebuild doubles as a final compile check.
      - name: Publish to npm (only if NPM_TOKEN is set)
        id: npm_publish
        if: startsWith(github.ref, 'refs/tags/v') && env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --access public
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Slim node_modules to production deps
        run: npm prune --omit=dev

      - name: Pack MCPB bundle
        run: npx --yes @anthropic-ai/mcpb pack . diagrams-so.mcpb

      - name: Upload .mcpb as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: diagrams-so-mcpb
          path: diagrams-so.mcpb

      - name: Attach .mcpb to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" diagrams-so.mcpb \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  # Publishes the server.json entry to registry.modelcontextprotocol.io.
  #
  # Auth is GitHub Actions OIDC, which grants the io.github.<owner>/* namespace
  # to workflows in that owner's repositories. This repo lives in the RedHold
  # org, so it is authorised for io.github.RedHold/diagrams-so-mcp — no PAT, no
  # stored secret, and no interactive browser login.
  registry:
    name: Publish to the official MCP registry
    needs: release
    if: startsWith(github.ref, 'refs/tags/v') && needs.release.outputs.npm_published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC
    steps:
      - uses: actions/checkout@v4

      # The registry resolves the npm package at the exact version server.json
      # declares and rejects the publish if that version is not readable yet,
      # so wait for the CDN rather than racing it.
      - name: Wait for npm to serve the new version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          for i in $(seq 1 30); do
            if [ "$(npm view "@diagrams-so/mcp@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "npm is serving $VERSION"
              exit 0
            fi
            echo "attempt $i: npm has not served $VERSION yet, waiting 10s"
            sleep 10
          done
          echo "::error::npm never served $VERSION after 5 minutes"
          exit 1

      - name: Publish
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher validate
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: Confirm the entry is live
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sleep 10
          curl -s "https://registry.modelcontextprotocol.io/v0/servers?search=diagrams-so-mcp" \
            | grep -q "io.github.RedHold/diagrams-so-mcp" \
            && echo "listed: io.github.RedHold/diagrams-so-mcp @ $VERSION" \
            || { echo "::error::published but not returned by search"; exit 1; }
